name: autofix.ci

on:
    pull_request:
    push:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

# Read-only: autofix.ci pushes the fix commit server-side via its GitHub App,
# so the workflow itself never needs write access or a secret. This is what makes
# running a formatter over untrusted fork code safe.
permissions:
    contents: read

concurrency:
    group: lint-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  clean: 'false'
                  fetch-depth: '0'
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true
                  # Restore only: build.yml is the single cache writer, so the saved cache always includes the npm cache.
                  cache_save: false
                  cache_key_prefix: mise-v2
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            # Pull requests run the fixers (hk fix) rather than verifying (hk check): in verify mode `dotnet format` fails on every
            # analyzer warning it has no code fix for, even in lines the change didn't touch; in fix mode it applies what it can and
            # passes. Steps with no fixer (actionlint, the private-key and merge-conflict checks, ...) still fail the run. The merge
            # queue runs no lint step: its temporary branch can't take a push, and the PR's run has already pushed its fixes.
            - name: 🧹 Lint (hk fix)
              if: github.event_name == 'pull_request'
              run: |
                  hk fix --from-ref "$BASE" --to-ref "$HEAD"
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
            # pull_request (same-repo AND fork): autofix.ci commits the fixes back to the PR.
            # Must be the LAST step: pushes the working-tree changes back as a
            # verified commit (and fails the check when a fix was needed).
            - name: ✍️ Apply fixes (autofix.ci)
              if: github.event_name == 'pull_request'
              uses: autofix-ci/action@v1.3.4
              with:
                  commit-message: Automatically linting code
